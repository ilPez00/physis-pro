<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Physis Pro — Sunflower</title>
  <defs>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6b3f1d"/>
      <stop offset="100%" stop-color="#3c2410"/>
    </radialGradient>
  </defs>
  <!-- stem -->
  <rect x="123" y="150" width="10" height="96" rx="5" fill="#3f7d20"/>
  <!-- leaves -->
  <path d="M128 210 q-46 -6 -60 -38 q40 6 60 30 z" fill="#4c9a2a"/>
  <path d="M128 196 q46 -6 60 -38 q-40 6 -60 30 z" fill="#4c9a2a"/>
  <!-- petals -->
  <g fill="#ffc517">
    <!-- 24 petals around center (128,128) r=64 -->
    <g transform="translate(128 128)">
      <g id="p"><ellipse cx="0" cy="-72" rx="11" ry="26"/></g>
      <use href="#p" transform="rotate(15)"/>
      <use href="#p" transform="rotate(30)"/>
      <use href="#p" transform="rotate(45)"/>
      <use href="#p" transform="rotate(60)"/>
      <use href="#p" transform="rotate(75)"/>
      <use href="#p" transform="rotate(90)"/>
      <use href="#p" transform="rotate(105)"/>
      <use href="#p" transform="rotate(120)"/>
      <use href="#p" transform="rotate(135)"/>
      <use href="#p" transform="rotate(150)"/>
      <use href="#p" transform="rotate(165)"/>
      <use href="#p" transform="rotate(180)"/>
      <use href="#p" transform="rotate(195)"/>
      <use href="#p" transform="rotate(210)"/>
      <use href="#p" transform="rotate(225)"/>
      <use href="#p" transform="rotate(240)"/>
      <use href="#p" transform="rotate(255)"/>
      <use href="#p" transform="rotate(270)"/>
      <use href="#p" transform="rotate(285)"/>
      <use href="#p" transform="rotate(300)"/>
      <use href="#p" transform="rotate(315)"/>
      <use href="#p" transform="rotate(330)"/>
      <use href="#p" transform="rotate(345)"/>
    </g>
  </g>
  <!-- seed center -->
  <circle cx="128" cy="128" r="44" fill="url(#center)"/>
  <!-- seed dots -->
  <g fill="#caa15a" opacity="0.85">
    <circle cx="128" cy="128" r="3"/>
    <circle cx="116" cy="124" r="2.6"/>
    <circle cx="140" cy="124" r="2.6"/>
    <circle cx="122" cy="138" r="2.6"/>
    <circle cx="134" cy="138" r="2.6"/>
    <circle cx="128" cy="116" r="2.6"/>
    <circle cx="112" cy="134" r="2.3"/>
    <circle cx="144" cy="134" r="2.3"/>
    <circle cx="128" cy="146" r="2.3"/>
  </g>
</svg>
