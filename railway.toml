[build]
dockerfile = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
startCommand = "./physis-pro-web"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.volumes]
data = { mountPath = "/app/.physis" }

[variables]
PHYSIS_DATA_DIR = "/app/.physis"
PHYSIS_HOST = "0.0.0.0"
PHYSIS_PORT = "8080"
# Auth placeholder variables for your Railway dashboard to override
OAUTH_CLIENT_ID = ""
OAUTH_CLIENT_SECRET = ""
OAUTH_COOKIE_SECRET = ""
