[package]
name = "llmwiki"
version = "0.2.1"
edition = "2024"
authors = ["llmwiki Contributors"]
description = "A local-first wiki search and indexing tool"
license = "MIT"
homepage = "https://krakiun.com"
repository = "https://github.com/krakiun/llmwiki"
keywords = ["wiki", "search", "mcp", "llm", "knowledge-base"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["wiki/", "llmwiki"]

[[bin]]
name = "llmwiki"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gray_matter = "0.2"
tantivy = "0.22"
fastembed = { version = "5", optional = true }
usearch = { version = "2", optional = true }
rmcp = { version = "0.1", features = ["server", "transport-io"] }
notify = "6"
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
anyhow = "1"
walkdir = "2"

[features]
default = ["semantic"]
semantic = ["dep:fastembed", "dep:usearch"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
