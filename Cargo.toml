[package]
name = "physis_pro"
version = "0.1.21"
edition = "2021"
# LICENSE.txt is a proprietary EULA ("licensed, not sold", enforced by the
# Ed25519 gate in src/license.rs), so there is no SPDX id to declare — only
# `license-file`. Carrying `license = "MIT"` alongside it made cargo warn and
# would have published this crate under a licence it is not offered under.
license-file = "LICENSE.txt"
readme = "README.md"
repository = "https://github.com/ilPez00/physis-pro"
description = "Tertium semper datur — industrial backoffice intelligence: process monitoring, inventory, document ingest, quality feedback, and pluggable backend seams (no existing module ever deleted)"
publish = true

keywords = ["ontology", "semantic", "classification", "industrial", "monitoring"]
categories = ["science", "text-processing", "embedded"]

[dev-dependencies]
tempfile = "3"
# Drives the router in-process (ServiceExt::oneshot) so the HTTP surface can be
# tested without binding a port.
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

# Test binaries were carrying full DWARF — http_surface alone made the linker
# blow past runner and workstation disk limits (collect2 SIGBUS = ENOSPC on
# CI, 2026-09-07). Line tables keep panic backtraces usable at a fraction of
# the size. Applies to workspace members via the root profile.
[profile.test]
debug = "line-tables-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
rand = { version = "0.9", features = ["std"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"
walkdir = "2"
rayon = "1"
# Interest daemon: clipboard access + OOXML (pptx/docx) unzip. Kept OUT of
# `full` — arboard wants a display server at runtime and CI has none.
# image only for the clipboard/daemon path; the HUD never touches it.
arboard = { version = "3.6", optional = true, default-features = false, features = ["wayland-data-control"] }
zip = { version = "2.2", default-features = false, features = ["deflate"], optional = true }

# In-process wiki engine (Phase 1: Tantivy BM25 only, no semantic deps).
# Vendored in-repo (vendor/llmwiki) so prod/CI builds resolve + can compile it
# without the private sibling crate. default-features=false → no fastembed/usearch.
llmwiki_physis = { path = "vendor/llmwiki", package = "llmwiki", version = "0.2", default-features = false, optional = true }

# The lean core engine — embed/classify/quality/discovery now live here, and
# physis_pro delegates to it (see src/classify.rs, src/quality.rs).
physis-core = { path = "physis-core", version = "0.1.17", default-features = false }

clap = { version = "4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["full"] }
notify = { version = "7", optional = true }
# `transport-io` adds the stdio transport. Every mainstream MCP client
# (Claude Code, Codex, OpenCode, Zed) spawns the server as a child process and
# frames JSON-RPC over stdin/stdout; the bare TCP listener this crate started
# with is reachable by none of them.
rmcp = { version = "0.1.3", features = ["transport-io"], optional = true }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "blocking"] }
axum = { version = "0.7", features = ["json", "macros"], optional = true }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["fs", "trace"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }
dotenvy = "0.15"
slotmap = { version = "1.0", features = ["serde"] }
memmap2 = "0.9"
bytemuck = { version = "1.15", features = ["derive"] }
crossbeam-channel = "0.5"
# Pinned exactly: ort is a release candidate; a new rc can change ONNX opset /
# loader behaviour and break inference at runtime. See PREMORTEM.md P4.
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.16", optional = true }
tokenizers = { version = "0.21", optional = true }
urlencoding = "2.1"
sled = "0.34"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
env_logger = "0.11"
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", features = ["events"], optional = true }

# Instructor gateway (operator crystallization P4). The typed-proposal gateway
# embeds a Python interpreter only when this feature is on, so default CI builds
# stay pure Rust. `abi3-py311` (not `extension-module`): the interpreter is
# embedded, and the wheels-style abi3 contract means a future Python bump does
# not break the build. See docs/plans/2026-09-18-operator-crystallization.md §9.
pyo3 = { version = "0.25", features = ["abi3-py311"], optional = true }

# Business backoffice dependencies
# Industrial protocol adapters. NOT optional: the industrial stack is part of
# the product, not a vertical bolted onto it, and a feature gate nothing in CI
# clippied was how src/industrial.rs accumulated warnings invisibly (PH-016).
rumqttc = { version = "0.25" }
tokio-modbus = { version = "0.17" }
calamine = { version = "0.24", optional = true }
csv = { version = "1.3", optional = true }
quick-xml = { version = "0.36", optional = true }
# Spanner service-account JWT minting (RS256).
jsonwebtoken = { version = "9", optional = true }

# Offline license verification (Ed25519). Not optional: the binary must never
# be buildable without the licence gate. `rand_core` is only pulled in by the
# keygen bin, which is excluded from the shipped package (see [[bin]] below).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"

# Optional document-ingestion backends (kept out of default so the core stays
# light and CI/disk stay sane; enable with --features pdf,email).
# pdf-extract: pure-Rust text extraction from PDF page streams.
pdf-extract = { version = "0.7", optional = true }
# mailparse: RFC-822 (.eml) parsing — From/Subject/body, quoted-reply stripping.
mailparse = { version = "0.15", optional = true }
# tesseract: OCR engine for scanning documents and images.
tesseract = { version = "0.14", optional = true }

# ONNX embedder is ON by default. It was opt-in to avoid deploying without model
# weights, but the weights have shipped since 2026-08-13 (models/model.onnx,
# BGE-base-en-v1.5, 86MB) and the opt-in had the opposite effect to the one intended — dropping
# the model silently — so it is default now.
# PH-114: Rerun backend deps. Path deps to the canonical rerun tree on the build
# host (/home/gio/dev/rerun). Optional + default-features=false so the standard
# build never pulls rerun. See docs/research/2026-09-22-rerun-mesa-findings.md §Rerun store.
re_chunk = { path = "/home/gio/dev/rerun/crates/store/re_chunk", version = "=0.39.0-alpha.1", default-features = false, optional = true }
re_chunk_store = { path = "/home/gio/dev/rerun/crates/store/re_chunk_store", version = "=0.39.0-alpha.1", default-features = false, optional = true }
re_query = { path = "/home/gio/dev/rerun/crates/store_app/re_query", version = "=0.39.0-alpha.1", default-features = false, optional = true }
re_log_types = { path = "/home/gio/dev/rerun/crates/store/re_log_types", version = "=0.39.0-alpha.1", default-features = false, optional = true }
# PH-116: re_renderer for the ViewClass render path (wgpu only, no egui shell).
# Per findings §Rerun visualization: "reuse seams, do not embed the shell."
# re_viewer_context/re_viewport_blueprint pull re_ui→eframe (egui) which fails
# to resolve and is explicitly out of scope — we render via wgpu directly.
re_renderer = { path = "/home/gio/dev/rerun/crates/viewer_support/re_renderer", version = "=0.39.0-alpha.1", default-features = false, optional = true }
wgpu = { version = "30.0", default-features = false, optional = true }

[features]
# intended: a plain `cargo build` or `cargo install physis_pro` silently fell
# back to RandomProjectionEmbedder (see src/embed/registry.rs), which the
# project's own QA verdict calls non-semantic. Every default build shipped an
# engine whose classification output was noise. If you genuinely want the
# model-free path, ask for it: `--no-default-features` plus the features you
# want, or select the random embedder explicitly at runtime.
default = ["cli", "voice", "web", "tui", "sql", "postgres", "email", "embed-onnx"]
embed-onnx = ["dep:ort", "dep:ndarray", "dep:tokenizers", "physis-core/embed-onnx"]
cli = ["dep:clap"]
mcp = ["dep:rmcp"]
network = ["dep:notify"]
voice = []
life-os = []
empedocles = []
rachmaninov = []
web = ["dep:axum", "dep:tower-http"]
tui = ["dep:ratatui", "dep:crossterm"]
# Instructor gateway: embeds Python (pyo3) so the real `instructor` package can
# drive the typed composition gateway. OFF by default — nothing on the hot path
# may take the GIL. `compose.rs` falls back to the native cascade when absent.
instructor = ["dep:pyo3"]
# Business backoffice features.
# `industrial` is now a NO-OP kept only so existing invocations
# (`--features industrial,cli`, scripts/predeploy.sh, CONTRIBUTING.md) keep
# working. MQTT/Modbus are unconditional; there is nothing left to gate.
industrial = []
# Image embedding (CLIP/Jina vision paths). Off by default: the image crate
# pulls moxcms/pxfm, whose asm requires GLIBC 2.43 — feather ships 2.41.
image-embed = ["embed-onnx", "image"]
# Repair-pipeline scaffolding (semantic_delta/dependency/staleness/
# repair_regions/orchestration/metrics). These six modules import each other
# in a cycle — dependency↔staleness↔semantic_delta and metrics↔orchestration —
# so a crate-level feature cannot split them; one gate is the only honest
# grouping. Nothing outside the cluster calls in (grep: crate::orchestration
# appears only in metrics and vice versa), so `--no-default-features`-style
# lean builds can drop it. Kept OFF by default: not deleting, just opt-in.
repair-pipeline = []
ingest = ["dep:calamine", "dep:csv", "dep:quick-xml", "dep:tesseract"]
sql = ["dep:rusqlite"]
postgres = ["dep:tokio-postgres"]
# Document ingestion: real PDF text extraction + structured email parsing.
pdf = ["dep:pdf-extract"]
email = ["dep:mailparse"]
# OCR pipeline: Tesseract-based OCR for scanned documents and images.
ocr = ["dep:tesseract"]
# Audio transcription: Whisper API integration for mp3/wav/flac.
audio = []
# In-process wiki engine (Tantivy BM25) — replaces the llmwiki subprocess.
# BM25 only for now (no fastembed/usearch → no ort conflict); semantic = Phase 2.
wiki-embedded = ["dep:llmwiki_physis"]
# Spanner Graph sink (Phase 7C) — durable wiki mirror. jsonwebtoken for SA auth.
spanner = ["dep:jsonwebtoken"]
# Vendor-side licence tooling (keygen + signing). NEVER enable this for a
# customer build: it builds the tool that mints licences. The shipped package
# is built without it, so the signing path is not even present in the binary.
vendor = ["dep:clap"]
# Local interest daemon: clipboard + watched-dir observation → interest profile.
daemon = ["dep:arboard", "dep:zip", "dep:notify", "dep:axum"]
# Optional backend seams from docs/research/2026-09-22-rerun-mesa-findings.md
# (P0-P3 integration). All default-OFF: no existing module deleted, no behaviour
# change unless opted in. Bodies are todo!() stubs until PH-114/PH-115/PH-116.
store-rerun = ["dep:re_chunk", "dep:re_chunk_store", "dep:re_query", "dep:re_log_types"]
temporal-rerun = ["dep:re_chunk", "dep:re_chunk_store", "dep:re_query", "dep:re_log_types"]
rerun-graph = ["dep:re_renderer", "dep:wgpu", "dep:re_chunk", "dep:re_chunk_store", "dep:re_query", "dep:re_log_types"]

full = ["cli", "network", "voice", "web", "tui", "embed-onnx", "industrial", "ingest", "pdf", "email", "audio", "ocr", "sql", "postgres", "mcp", "repair-pipeline", "instructor"]



# SKU feature tiers
base = ["cli", "voice", "web", "tui"]
# ingest = ["dep:calamine", "dep:csv", "dep:quick-xml"]  # already defined in features
rag = []
# full = ["cli", "voice", "web", "tui", "embed-onnx", "industrial", "ingest", "pdf", "email", "mcp", "sql", "postgres"]  # already defined in features

[[bin]]
name = "physis"
path = "src/bin/physis.rs"
required-features = ["cli"]

[[bin]]
name = "physis-pro"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "physis-pro-web"
required-features = ["web"]
path = "src/bin/web_server.rs"

[[bin]]
name = "physis-pro-tui"
required-features = ["tui"]
path = "src/bin/tui.rs"

[[bin]]
name = "physis-pro-voice"
required-features = ["voice", "web"]
path = "src/bin/voice.rs"

[[bin]]
name = "physis-pro-wiki"
required-features = ["tui"]
path = "src/bin/wiki.rs"

[[bin]]
name = "physis-hud"
required-features = ["tui"]
path = "src/bin/hud.rs"

# One demo product: graph browsing + notebook + diff reviewer + HUD world pane +
# ops registry, in one offline-first shell. Old bins stay as they are.
[[bin]]
name = "physis-studio"
required-features = ["tui"]
path = "src/bin/studio.rs"

# physis-core lives as a subdirectory and is also published as its own crate;
# this workspace lets `cargo` build/test both the monolith and the core together
# (resolver 2 keeps feature unification per-target, so physis_pro's
# default-features=false on physis-core keeps its cli/studio out of the monolith).
[workspace]
resolver = "2"
members = ["physis-core", "tools/llm-coherence-scan"]
# vendor/llmwiki carries its own [profile.release]; keeping it out of the
# workspace avoids the "profiles for the non root package will be ignored"
# warning (it's still reachable as the `llmwiki_physis` path dependency).
exclude = ["vendor/llmwiki"]

# Local interest daemon (clipboard + watched dirs → profile). Feature-gated:
# needs a display server for arboard at runtime, so never in CI/full.
[[bin]]
name = "physis-interest-daemon"
required-features = ["daemon"]

# Vendor-only. Excluded from customer packages by `required-features`.
[[bin]]
name = "physis-license"
required-features = ["vendor"]
path = "src/bin/license_tool.rs"

# These two examples import `physis_pro::empedocles`, which is behind the
# off-by-default `empedocles` feature. Without `required-features` here,
# `cargo check --all-targets` builds them anyway and fails on the unresolved
# import; declaring the requirement makes cargo skip them instead.
[[example]]
name = "empedocles_criticality"
required-features = ["empedocles"]
path = "examples/empedocles_criticality.rs"

[[example]]
name = "empedocles_no_regression"
required-features = ["empedocles"]
path = "examples/empedocles_no_regression.rs"
