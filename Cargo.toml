[package]
name = "physis_pro"
version = "0.1.0"
edition = "2021"
description = "Industrial backoffice intelligence — process monitoring, inventory, document ingest, quality feedback"

[dev-dependencies]
tempfile = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
regex = "1"
once_cell = "1"
walkdir = "2"
rayon = "1"

# In-process wiki engine (Phase 1: Tantivy BM25 only, no semantic deps).
llmwiki_physis = { path = "../llmwiki_physis", package = "llmwiki", default-features = false, optional = true }

clap = { version = "4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["full"] }
notify = { version = "7", optional = true }
rmcp = { version = "0.1", optional = true }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
axum = { version = "0.7", features = ["json", "macros"], optional = true }
tower-http = { version = "0.5", features = ["fs"], optional = true }
dotenvy = "0.15"
slotmap = { version = "1.0", features = ["serde"] }
memmap2 = "0.9"
bytemuck = { version = "1.15", features = ["derive"] }
crossbeam-channel = "0.5"
# Pinned exactly: ort is a release candidate; a new rc can change ONNX opset /
# loader behaviour and break inference at runtime. See PREMORTEM.md P4.
ort = { version = "=2.0.0-rc.12", optional = true }
ndarray = { version = "0.16", optional = true }
tokenizers = { version = "0.21", optional = true }
urlencoding = "2.1"
sled = "0.34"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
futures = "0.3"
base64 = "0.22"
image = "0.25"
env_logger = "0.11"
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", features = ["events"], optional = true }

# Business backoffice dependencies
rumqttc = { version = "0.25", optional = true }
tokio-modbus = { version = "0.17", optional = true }
calamine = { version = "0.24", optional = true }
csv = { version = "1.3", optional = true }
quick-xml = { version = "0.36", optional = true }

# Enable ONNX feature by default
[features]
default = ["cli", "voice", "web", "tui", "embed-onnx"]
cli = ["dep:clap"]
mcp = ["dep:rmcp"]
network = ["dep:notify"]
voice = []
web = ["dep:axum", "dep:tower-http"]
tui = ["dep:ratatui", "dep:crossterm"]
embed-onnx = ["dep:ort", "dep:ndarray", "dep:tokenizers"]
# Business backoffice features
industrial = ["dep:rumqttc", "dep:tokio-modbus"]
ingest = ["dep:calamine", "dep:csv", "dep:quick-xml"]
# In-process wiki engine (Tantivy BM25) — replaces the llmwiki subprocess.
# BM25 only for now (no fastembed/usearch → no ort conflict); semantic = Phase 2.
wiki-embedded = ["dep:llmwiki_physis"]
# Spanner Graph sink (Phase 7C) — durable wiki mirror. No new deps (reqwest).
spanner = []

full = ["cli", "network", "voice", "web", "tui", "embed-onnx", "industrial", "ingest"]

[[bin]]
name = "physis-pro"
path = "src/main.rs"

[[bin]]
name = "physis-pro-web"
required-features = ["web"]
path = "src/bin/web_server.rs"

[[bin]]
name = "physis-pro-tui"
required-features = ["voice", "tui"]
path = "src/bin/tui.rs"

[[bin]]
name = "physis-pro-voice"
required-features = ["voice", "web"]
path = "src/bin/voice.rs"

[[bin]]
name = "physis-pro-wiki"
required-features = ["tui"]
path = "src/bin/wiki.rs"
