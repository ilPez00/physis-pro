<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physis Pro — API Tester</title>
  <link rel="stylesheet" href="/physis.css">
</head>
<body>
  <header>
    <h1>Physis <span>· API Tester</span></h1>
    <button id="backBtn" style="margin-left:auto;">← Back</button>
  </header>

  <main>
    <div class="card">
      <div class="card-header">API Call Tester</div>
      <div class="card-body">
        <div style="margin-bottom:10px;">
          <label for="endpoint">Endpoint</label>
          <select id="endpoint">
            <option value="/api/v1/classify">classify</option>
            <option value="/api/v1/ask">ask</option>
            <option value="/api/v1/quality">quality</option>
            <option value="/api/v1/communities">communities</option>
            <option value="/api/v1/quality/trace">quality/trace</option>
          </select>
        </div>
        <div style="margin-bottom:10px;">
          <label for="request-body">Request Body</label>
          <textarea id="request-body" rows="3" placeholder='{"text": "emergency brake failure on spindle"}'></textarea>
        </div>
        <button id="run-btn" class="primary" style="width:100%;">Run API Call</button>
      </div>
    </div>

    <div class="card" style="margin-top:10px;">
      <div class="card-header">Response</div>
      <div class="card-body" id="response-body">
        <pre style="white-space:pre-wrap; color:var(--ink);">Waiting for response...</pre>
      </div>
    </div>

    <div class="card" style="margin-top:10px;">
      <div class="card-header">Billing Info</div>
      <div class="card-body" id="billing-info">
        <p>No billing info yet</p>
      </div>
    </div>
  </main>
</body>

<script>
  const customerId = localStorage.getItem('physis_customer_id');
  if (!customerId) {
    window.location.href = '/';
    return;
  }

  const apiKey = localStorage.getItem('physis_api_key');
  const endpointSelect = document.getElementById('endpoint');
  const requestBody = document.getElementById('request-body');
  const runBtn = document.getElementById('run-btn');
  const responseBody = document.getElementById('response-body');
  const billingInfo = document.getElementById('billing-info');

  // Populate endpoint options with descriptions
  const endpoints = {
    '/api/v1/classify': 'Classify text into domain×mode cell',
    '/api/v1/ask': 'Ask the graph with grounded synthesis',
    '/api/v1/quality': 'Read quality ledger and penalties',
    '/api/v1/communities': 'Community detection on the graph',
    '/api/v1/quality/trace': 'Trace a quality failure upstream'
  };

  endpointSelect.innerHTML = Object.keys(endpoints).map(k => 
    `<option value="${k}">${endpoints[k]}</option>`
  ).join('');

  // Run API call
  runBtn.addEventListener('click', async () => {
    const sel = endpointSelect.value;
    const body = requestBody.value || '{}';
    
    runBtn.disabled = true;
    runBtn.textContent = 'Running...';
    
    try {
      const response = await fetch(`/api/v1${sel}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${customerId}`,
          'Content-Type': 'application/json'
        },
        body: body
      });
      
      const data = await response.json();
      
      // Display response
      responseBody.innerHTML = `
        <div><strong>Status:</strong> ${response.success ? 'success' : 'error'}</div>
        <div><strong>Job cost:</strong> $${data.billing?.job_cost || 0}</div>
        <div><strong>Remaining jobs:</strong> ${data.billing?.remaining_jobs || 'N/A'}</div>
        <div><strong>Tokens used:</strong> ${data.tokens_used || 0}</div>
        <div>${data.answer ? '<strong>Answer:</strong> ' + data.answer : ''}</div>
        <div>${data.error ? '<strong>Error:</strong> ' + data.error : ''}</div>
      `;
      
      // Update billing info
      if (data.billing) {
        billingInfo.innerHTML = `
          <div>Job cost: $${data.billing.job_cost}</div>
          <div>Remaining jobs: ${data.billing.remaining_jobs}</div>
          <div>Monthly budget: ${data.billing.monthly_budget}</div>
        `;
      }
      
    } catch (err) {
      responseBody.innerHTML = `<div style="color:var(--rose);">Error: ${err.message}</div>`;
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = 'Run API Call';
    }
  });
