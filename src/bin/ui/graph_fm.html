<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Physis — Graph File Manager</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="ui-shell.js"></script>
<link rel="stylesheet" href="/physis.css" />
<style>
  /* page-local layout on top of the shared Bioluminal Forge system */
  body { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { position:relative; z-index:2; padding:10px 14px; background:rgba(4,7,15,.82);
           backdrop-filter:blur(12px); border-bottom:1px solid var(--shelf);
           display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 14px 0 0; font-weight:800; letter-spacing:.04em;
              font-family:var(--mono); text-transform:uppercase; }
  header h1 .glow { color:var(--cyan); }
  input, button, select { border-radius:var(--r-m); }
  #dir { min-width:260px; }
  .muted { color:var(--brume); }
  main { flex:1; display:flex; min-height:0; }
  #cy { flex:1; background:transparent; }
  aside { width:380px; border-left:1px solid var(--shelf); background:rgba(4,7,15,.72);
          backdrop-filter:blur(10px); display:flex; flex-direction:column; min-height:0; z-index:2; }
  .pane { padding:12px 14px; border-bottom:1px solid var(--shelf); overflow:auto; }
  #preview { flex:1; display:flex; flex-direction:column; }
  #content { flex:1; white-space:pre-wrap; word-break:break-word; font:11.5px/1.5 var(--mono);
             background:rgba(4,7,15,.85); border:1px solid var(--shelf); border-radius:var(--r-m);
             padding:9px; max-height:100%; overflow:auto; color:var(--ink); }
  /* semiotic heatmap — bioluminal cells */
  #heat { display:grid; gap:2px; font-size:9px; grid-template-columns:repeat(14,1fr); width:100%; }
  .hc { aspect-ratio:1; border-radius:2px; transition:transform .12s ease, box-shadow .12s ease;
        box-shadow:inset 0 0 0 1px rgba(122,150,214,.08); }
  .hc:hover { transform:scale(1.35); z-index:3; box-shadow:0 0 12px rgba(95,242,214,.65), inset 0 0 0 1px rgba(232,241,255,.5); }
  .rowlab,.collab { color:var(--brume); font-size:8px; font-family:var(--mono); }
  h3 { margin:0 0 8px; }
  #status { margin-left:auto; font-size:12px; font-family:var(--mono); }
  .err { color:var(--rose); }
  label.small { font-size:11px; color:var(--brume); display:block; margin:6px 0 2px; }
</style>
  <script src="/sunflower.js"></script>
</head>
<body>
<header>
  <h1>PHYSIS <span class="glow">·</span> GRAPH FILE MANAGER</h1>
  <input id="base" placeholder="API base (blank = same origin)" />
  <input id="token" type="password" placeholder="API token (Bearer)" />
  <input id="dir" placeholder="/abs/path/to/scan (inside scan root)" />
  <button id="scan">Scan →</button>
  <select id="grid" title="hubs">
    <option value="cells">semiotic cells</option>
    <option value="discovered">discovered modes</option>
  </select>
  <select id="view" title="edges">
    <option value="cells">hub edges</option>
    <option value="both">hubs + similarity</option>
    <option value="sim">similarity only</option>
  </select>
  <input id="search" placeholder="filter files…" style="min-width:130px" />
  <span id="status" class="muted">idle</span>
</header>
<main>
  <div id="cy"></div>
  <aside>
    <div class="pane">
      <h3>Semiotic heatmap (5×14)</h3>
      <div id="heat"></div>
    </div>
    <div class="pane" id="info">
      <h3>Selection</h3>
      <div id="sel" class="muted">Click a node.</div>
      <div id="moveBox" style="display:none">
        <label class="small">Rename / move to (absolute path, inside scan root)</label>
        <div style="display:flex; gap:6px">
          <input id="dest" style="flex:1" />
          <button id="move">Move</button>
        </div>
      </div>
    </div>
    <div class="pane" id="preview">
      <h3>Preview</h3>
      <div id="content" class="muted">—</div>
    </div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const LS = { base:'physis_base', token:'physis_token', dir:'physis_dir' };
['base','token','dir'].forEach(k => { const v=localStorage.getItem(LS[k]); if(v) $(k).value=v; });
const save = () => ['base','token','dir'].forEach(k => localStorage.setItem(LS[k], $(k).value));

const DOMAINS = ["HEAL","CONSTRUCT","FABRICATE","BOND","STUDY"];
const MODES = ["LIFT","REST","WALK","WORK","CREATE","LEARN","DESTROY","SENSE","GUIDE","PLAY","BRAINSTORM","MAINTAIN","MOVE","PLAN"];
// Bioluminal domain palette (matches physis.css accents; stable per domain)
const DCOL = {HEAL:"#a8e663",CONSTRUCT:"#ffc46b",FABRICATE:"#5ff2d6",BOND:"#9d8cff",STUDY:"#ff8fd0","":"#7e93b8"};

function api(path){ const b=$('base').value.trim().replace(/\/$/,''); return (b||'')+path; }
function headers(){ const t=$('token').value.trim(); return t?{Authorization:'Bearer '+t}:{}; }
function setStatus(msg, err){ const s=$('status'); s.textContent=msg; s.className=err?'err':'muted'; }

async function getJSON(path){
  const r = await fetch(api(path), {headers:headers()});
  if(!r.ok){ throw new Error(r.status+' '+(await r.text()).slice(0,200)); }
  return r.json();
}

let cy;
function initCy(){
  cy = cytoscape({
    container: $('cy'),
    style: [
      { selector:'node[kind="theme"]', style:{ 'background-color':'data(color)','label':'data(label)','color':'#e8f1ff','font-size':10,'font-weight':700,'text-valign':'center','width':'data(sz)','height':'data(sz)','text-outline-color':'#04070f','text-outline-width':2.5 } },
      { selector:'node[kind="file"]', style:{ 'background-color':'data(color)','border-color':'rgba(232,241,255,.25)','border-width':1,'label':'data(label)','color':'#7e93b8','font-size':8,'shape':'round-rectangle','width':11,'height':11 } },
      { selector:'node:selected', style:{ 'border-color':'#5ff2d6','border-width':3,'overlay-color':'rgba(95,242,214,.18)','overlay-padding':6 } },
      { selector:'edge[etype="theme"]', style:{ 'width':'data(w)','line-color':'rgba(122,150,214,.35)','opacity':0.55,'curve-style':'haystack' } },
      { selector:'edge[etype="sim"]', style:{ 'width':'data(w)','line-color':'#5ff2d6','line-style':'dashed','opacity':0.5,'curve-style':'haystack' } }
    ],
    layout:{name:'cose', animate:false}
  });
  cy.on('tap','node', evt => onNode(evt.target));
}

function onNode(n){
  const d=n.data();
  $('moveBox').style.display = d.kind==='file' ? 'block' : 'none';
  if(d.kind==='file'){
    $('sel').innerHTML = `<b>${d.label}</b><br><span class="muted">${d.path}</span><br>kind: ${d.fkind}`;
    $('dest').value = d.path;
    preview(d.path);
  } else {
    $('sel').innerHTML = `<b>${d.label}</b><br><span class="muted">${d.domain}×${d.mode}${d.category?(' · '+d.category):''}</span>`;
    $('content').textContent='—';
  }
}

async function preview(path){
  $('content').textContent='loading…';
  try{
    const j = await getJSON('/api/v1/fs/file?path='+encodeURIComponent(path));
    $('content').textContent = j.content + (j.truncated?'\n\n… [truncated, '+j.size+' bytes]':'');
    $('content').className='';
  }catch(e){ $('content').textContent=String(e); $('content').className='err'; }
}

async function scan(){
  save();
  const dir=$('dir').value.trim();
  if(!dir){ setStatus('enter a directory', true); return; }
  setStatus('scanning…');
  try{
    const grid=$('grid').value;
    const g = await getJSON('/api/v1/fs/graph?dir='+encodeURIComponent(dir)+'&grid='+grid);
    lastG = g;
    render(g);
    const hub = grid==='discovered' ? 'discovered-modes' : 'cells';
    setStatus(`${g.themes.length} ${hub} · ${g.files.length} files · ${g.edges.length} hub-edges · ${(g.file_edges||[]).length} sim-edges`);
  }catch(e){ setStatus(String(e), true); }
}

// Palette for discovered-mode hubs (no fixed domain → color by index).
const PALETTE = ['#5ff2d6','#9d8cff','#ffc46b','#ff8fd0','#a8e663','#6bc7ff','#ffb36b','#b49cff','#7ef2c4','#ff9ab0'];
let lastG = null;
function render(g){
  if(!g) return;
  const view = $('view').value;            // cells | both | sim
  const showCells = view !== 'sim';
  const showSim   = view !== 'cells';
  // Hub color: fixed grid → by domain; discovered → palette by hub index.
  const hubColor = {};
  g.themes.forEach((t,i)=>{ hubColor[t.id] = (t.domain==='discovered') ? PALETTE[i%PALETTE.length] : (DCOL[t.domain]||DCOL['']); });
  const els=[];
  if(showCells){
    const maxDeg = Math.max(1, ...g.themes.map(t => g.edges.filter(e=>e.theme_id===t.id).length));
    for(const t of g.themes){
      const deg = g.edges.filter(e=>e.theme_id===t.id).length;
      els.push({data:{ id:'t'+t.id, kind:'theme', label:t.name, color:hubColor[t.id],
        domain:t.domain, mode:t.mode, category:t.category||'', sz:20+30*deg/maxDeg }});
    }
  }
  // File nodes colored by their top hub (so clusters read in similarity view too).
  const topHub = {};
  for(const e of g.edges){ if(topHub[e.file_id]===undefined) topHub[e.file_id]=e.theme_id; }
  for(const f of g.files){
    els.push({data:{ id:'f'+f.id, kind:'file', label:f.title||f.path.split('/').pop(), path:f.path, fkind:f.kind,
      color: hubColor[topHub[f.id]]||DCOL[''] }});
  }
  if(showCells){
    for(const e of g.edges){
      els.push({data:{ id:'te'+e.theme_id+'_'+e.file_id, etype:'theme', source:'t'+e.theme_id, target:'f'+e.file_id, w:1+3*e.score }});
    }
  }
  if(showSim){
    for(const e of (g.file_edges||[])){
      els.push({data:{ id:'se'+e.source+'_'+e.target, etype:'sim', source:'f'+e.source, target:'f'+e.target, w:1+3*(e.score-0.5) }});
    }
  }
  cy.elements().remove();
  cy.add(els);
  cy.layout({name:'cose', animate:false, nodeRepulsion:8000, idealEdgeLength:60}).run();
  applySearch();
}

// Dim file nodes whose name doesn't match the search box.
function applySearch(){
  const q=($('search').value||'').toLowerCase().trim();
  cy.batch(()=>{
    cy.nodes('[kind="file"]').forEach(n=>{
      const hit = !q || (n.data('label')||'').toLowerCase().includes(q) || (n.data('path')||'').toLowerCase().includes(q);
      n.style('opacity', hit?1:0.08);
    });
  });
}

async function move(){
  const from=$('sel').querySelector('b')?.nextSibling; // not reliable; use stored path
  const node = cy.$('node:selected').first();
  if(!node || node.data('kind')!=='file'){ return; }
  const dest=$('dest').value.trim();
  setStatus('moving…');
  try{
    const r = await fetch(api('/api/v1/fs/move'), {method:'POST', headers:{...headers(),'Content-Type':'application/json'}, body:JSON.stringify({from:node.data('path'), to:dest})});
    if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,200));
    const j=await r.json();
    node.data('path', j.to);
    node.data('label', j.to.split('/').pop());
    setStatus('moved → '+j.to);
  }catch(e){ setStatus(String(e), true); }
}

async function loadHeat(){
  try{
    const j = await getJSON('/api/v1/semiotic/heatmap');
    const m = j.matrix||[];
    const heat=$('heat');
    heat.style.gridTemplateColumns = `48px repeat(${MODES.length}, 1fr)`;
    let html = `<div></div>` + MODES.map(x=>`<div class="collab" title="${x}">${x.slice(0,3)}</div>`).join('');
    let max=0; m.forEach(r=>r.forEach(v=>{ if(v>max)max=v; }));
    for(let i=0;i<m.length;i++){
      html += `<div class="rowlab">${(DOMAINS[i]||'').slice(0,4)}</div>`;
      for(let k=0;k<m[i].length;k++){
        const v=m[i][k], a=max>0?v/max:0;
        // bioluminal ramp: abyss → deep teal → cyan → violet-white core
        const bg = a < 0.02
          ? 'rgba(122,150,214,.07)'
          : `rgb(${Math.round(10+85*a)},${Math.round(18+180*a)},${Math.round(32+120*a)})`;
        const glow = a > 0.66 ? `box-shadow:0 0 ${Math.round(8*a)}px rgba(95,242,214,${a*.5})` : '';
        html += `<div class="hc" title="${DOMAINS[i]}×${MODES[k]} = ${v.toFixed(3)}" style="background:${bg};${glow}"></div>`;
      }
    }
    heat.innerHTML=html;
  }catch(e){ $('heat').innerHTML=`<span class="err">${e}</span>`; }
}

$('scan').onclick=scan;
$('move').onclick=move;
$('view').onchange=()=>render(lastG);
$('grid').onchange=scan;          // hubs come from the server → re-scan
$('search').oninput=applySearch;
['base','token'].forEach(k=>$(k).onchange=()=>{ save(); loadHeat(); });
initCy();
loadHeat();
</script>
</body>
</html>
