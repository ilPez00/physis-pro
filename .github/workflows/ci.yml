name: Rust CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo check (default)
        run: cargo check
      - name: cargo check (full)
        run: cargo check --features full
      - name: cargo check (industrial)
        run: cargo check --features industrial,cli
      - name: cargo check (spanner)
        run: cargo check --features spanner
      - name: cargo check (wiki-embedded — vendored llmwiki)
        run: cargo check --features wiki-embedded
      - name: cargo build (examples — machine demos)
        run: cargo build --examples
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --features full

  # Verify the Spanner sink's REST round-trip against the official emulator
  # (gcloud provisions the instance/db/table; the Rust test does the data plane).
  spanner-emulator:
    runs-on: ubuntu-latest
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
          - 9020:9020
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: google-github-actions/setup-gcloud@v2
      - name: provision emulator (instance + db + WikiNode table)
        run: |
          # Point the gcloud CLI at the emulator's REST gateway (not the live API).
          gcloud config set auth/disable_credentials true
          gcloud config set project test-project
          gcloud config set api_endpoint_overrides/spanner http://localhost:9020/
          gcloud spanner instances create test-instance \
            --config=emulator-config --description=ci --nodes=1
          gcloud spanner databases create test-db --instance=test-instance \
            --ddl="CREATE TABLE WikiNode (id STRING(64) NOT NULL, label STRING(MAX), coherence FLOAT64, dim INT64, embedder STRING(64)) PRIMARY KEY (id)"
      - name: round-trip test
        env:
          SPANNER_REST_ENDPOINT: http://localhost:9020
          SPANNER_PROJECT: test-project
          SPANNER_INSTANCE: test-instance
          SPANNER_DATABASE: test-db
        run: cargo test --features spanner -- --ignored --nocapture spanner_emulator_roundtrip
