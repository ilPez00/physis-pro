name: Rust CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `full` (and `ingest`) pull the tesseract OCR crate, whose -sys build
      # needs the system libraries; without these the `full` combo cannot
      # even compile on a runner (leptonica-sys build script, 2026-09-07).
      - name: install OCR system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libtesseract-dev libleptonica-dev
      # Incremental artifacts are multi-GB dead weight in one-shot CI builds;
      # restored caches plus them overflowed the runner disk and SIGBUS'd the
      # linker on the http_surface test binary (2026-09-07).
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (default)
        run: cargo check
      - name: cargo check (full)
        run: cargo check --features full
      # `industrial` is a no-op feature since the MQTT/Modbus stack became
      # unconditional. Kept as a check so the alias keeps resolving for the
      # scripts and docs that still pass it; the real coverage of
      # src/industrial.rs is now the default-feature clippy step below, which
      # is what PH-016 asked for — a feature gate nothing clippied was how two
      # warnings accumulated there invisibly.
      - name: cargo check (industrial alias still resolves)
        run: cargo check --features industrial,cli
      - name: cargo check (spanner)
        run: cargo check --features spanner
      - name: cargo check (wiki-embedded — vendored llmwiki)
        run: cargo check --features wiki-embedded
      - name: cargo check (mcp — model context protocol)
        run: cargo check --features mcp
      - name: cargo check (voice + tui feature interactions)
        run: cargo check --features voice,tui
      # PH-014 Item A regression guard: commit bb469ea broke this and nothing
      # caught it for a day because no job checked the whole workspace
      # (physis_pro + the physis-core submodule together). This is the check
      # that makes that silent for a day, not a compile error on the next PR.
      - name: cargo check (workspace — catches monolith/submodule drift)
        run: cargo check --workspace
      - name: cargo build (examples — machine demos)
        run: cargo build --examples
      # Default features now include the industrial stack, so this single
      # step covers src/industrial.rs. Do not re-gate it behind a feature
      # without adding a matching clippy step (PH-016).
      - name: clippy (default — includes the industrial stack)
        run: cargo clippy --all-targets -- -D warnings

  # PH-014 Item C: refuse any tracked blob over 25MB. Catches the case the
  # pre-commit hook can't (hooks are per-clone, opt-in, not enforced on
  # someone else's checkout) — this runs on every push/PR regardless.
  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: no tracked file over 25MB
        # `git ls-files` also lists the physis-core *gitlink* — a directory,
        # not a regular file. `test -f` on it fails, xargs reports 123, and
        # the job red on every run regardless of file sizes. Skip non-regular
        # paths instead of failing on them; only a genuinely oversized blob
        # (stat output over the threshold) fails the job.
        run: |
          set -euo pipefail
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" || exit 0; stat -c "%s %n" "{}"' 2>/dev/null | awk '$1 > 25000000')
          if [ -n "$big" ]; then
            echo "tracked file(s) over 25MB:" >&2
            echo "$big" >&2
            exit 1
          fi

  # PH-014 Item B: prove the release guard actually rejects a dirty tree and
  # an untagged HEAD, on every push — "a guard nobody proved fails is not a
  # guard."
  release-integrity-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: check-release-integrity.sh --self-test
        run: ./scripts/check-release-integrity.sh --self-test

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # full → ingest → tesseract; see the check job note.
      - name: install OCR system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libtesseract-dev libleptonica-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --features full

  # PREMORTEM P9: the #[ignore] accuracy floor is the silent-regression guard —
  # a degraded/swapped model or an ontology/scoring drift scores ~random (P0) and
  # nothing else catches it. It's #[ignore] only because it needs a real model on
  # disk; here CI provides one (BGE-base, English + Italian anchors → passes both
  # the CORE and ITALIAN gates) so the guard finally runs automatically, the same
  # way spanner-emulator provisions its dependency then runs its ignored test.
  accuracy-floor:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # full → ingest → tesseract; see the check job note.
      - name: install OCR system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libtesseract-dev libleptonica-dev
      - uses: Swatinem/rust-cache@v2
      # Cache the ~400MB model across runs — keyed on the script so a model
      # change busts the cache.
      - name: cache BGE-base model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/bge-base-en-v1.5
          key: bge-base-en-v1.5-${{ hashFiles('scripts/download_models.sh') }}
      - name: fetch BGE-base (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BD=models/bge-base-en-v1.5
          for p in onnx/model.onnx tokenizer.json config.json tokenizer_config.json; do
            mkdir -p "$BD/$(dirname "$p")"
            echo "fetching $p"
            curl -fL --retry 5 --retry-delay 5 \
              "https://huggingface.co/Xenova/bge-base-en-v1.5/resolve/main/$p" \
              -o "$BD/$p"
          done
          ls -la "$BD" "$BD/onnx"
      - name: accuracy floor (CORE + ITALIAN gates, real model)
        run: cargo test --features full --test classification -- --ignored --nocapture accuracy_floor

  # Verify the Spanner sink's REST round-trip against the official emulator
  # (gcloud provisions the instance/db/table; the Rust test does the data plane).
  spanner-emulator:
    runs-on: ubuntu-latest
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
          - 9020:9020
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: google-github-actions/setup-gcloud@v2
      - name: provision emulator (instance + db + WikiNode table)
        run: |
          # Point the gcloud CLI at the emulator's REST gateway (not the live API).
          gcloud config set auth/disable_credentials true
          gcloud config set project test-project
          gcloud config set api_endpoint_overrides/spanner http://localhost:9020/
          gcloud spanner instances create test-instance \
            --config=emulator-config --description=ci --nodes=1
          gcloud spanner databases create test-db --instance=test-instance \
            --ddl="CREATE TABLE WikiNode (id STRING(64) NOT NULL, label STRING(MAX), coherence FLOAT64, dim INT64, embedder STRING(64)) PRIMARY KEY (id)"
          gcloud spanner databases ddl update test-db --instance=test-instance \
            --ddl="CREATE TABLE WikiEdge (source STRING(64) NOT NULL, target STRING(64) NOT NULL, weight FLOAT64) PRIMARY KEY (source, target)"
      - name: round-trip test
        # --lib: the round-trip test lives in the lib test module; building
        # every integration test binary too filled the runner's ~14 GB disk
        # and killed the linker (collect2 SIGBUS = ENOSPC, 2026-09-07).
        env:
          SPANNER_REST_ENDPOINT: http://localhost:9020
          SPANNER_PROJECT: test-project
          SPANNER_INSTANCE: test-instance
          SPANNER_DATABASE: test-db
        run: cargo test --lib --features spanner -- --ignored --nocapture spanner_emulator_roundtrip

  # HUD snapshot matrix: render one frame per view and assert rc=0.
  # PHYSIS_EMBEDDER=random-projection guarantees sub-second completion:
  #   - no ONNX/ollama model load (warm-up embed is gated on !headless anyway)
  #   - workspace_tokens is skipped (headless=true in snapshot_run)
  #   - open_for_snapshot opens a temporary sled (no lock contention)
  # PHYSIS_OLLAMA_EMBED_OFF=1 is belt-and-suspenders in case the env var
  # ordering ever lets the ollama probe run before RP is selected.
  hud-snapshots:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      PHYSIS_EMBEDDER: random-projection
      PHYSIS_OLLAMA_EMBED_OFF: "1"
    strategy:
      matrix:
        view: [world, graph, settings, notebook, tasks, agents, help]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build physis-hud
        run: cargo build --features tui --bin physis-hud
      - name: snapshot ${{ matrix.view }}
        run: |
          ./target/debug/physis-hud . --no-prescan \
            --snapshot=100x30 --view=${{ matrix.view }} \
            > /tmp/snap-${{ matrix.view }}.txt
          echo "=== ${{ matrix.view }} ==="
          cat /tmp/snap-${{ matrix.view }}.txt
