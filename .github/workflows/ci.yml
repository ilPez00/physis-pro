name: Rust CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stub the llmwiki path dep (private sibling, absent on CI)
        # `llmwiki_physis` is a private sibling crate referenced by path. It's an
        # OPTIONAL dep behind `wiki-embedded`, which no CI step enables — so cargo
        # only needs the manifest to *resolve*, never to compile. Generate a
        # minimal stub crate named `llmwiki` so resolution succeeds without a
        # cross-repo token. (Real builds use the actual crate locally.)
        run: |
          mkdir -p ../llmwiki_physis/src
          printf '[package]\nname = "llmwiki"\nversion = "0.2.1"\nedition = "2021"\n' > ../llmwiki_physis/Cargo.toml
          : > ../llmwiki_physis/src/lib.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo check (default)
        run: cargo check
      - name: cargo check (full)
        run: cargo check --features full
      - name: cargo check (industrial)
        run: cargo check --features industrial,cli
      - name: cargo check (spanner)
        run: cargo check --features spanner
      - name: cargo build (examples — machine demos)
        run: cargo build --examples
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stub the llmwiki path dep (private sibling, absent on CI)
        # `llmwiki_physis` is a private sibling crate referenced by path. It's an
        # OPTIONAL dep behind `wiki-embedded`, which no CI step enables — so cargo
        # only needs the manifest to *resolve*, never to compile. Generate a
        # minimal stub crate named `llmwiki` so resolution succeeds without a
        # cross-repo token. (Real builds use the actual crate locally.)
        run: |
          mkdir -p ../llmwiki_physis/src
          printf '[package]\nname = "llmwiki"\nversion = "0.2.1"\nedition = "2021"\n' > ../llmwiki_physis/Cargo.toml
          : > ../llmwiki_physis/src/lib.rs
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --features full
