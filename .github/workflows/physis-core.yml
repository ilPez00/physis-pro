name: physis-core CI

# Dedicated CI for the lean core engine (published as its own crate).
# Mirrors the check/test/clippy split of the monolith's ci.yml but scoped to
# physis-core, and verifies the dependency-light promise: the engine must build
# with NO default features (no axum/clap/ort) and with ALL features.
on:
  push:
    paths:
      - "physis-core/**"
      - ".github/workflows/physis-core.yml"
  pull_request:
    paths:
      - "physis-core/**"
      - ".github/workflows/physis-core.yml"
  # Submodule pointer bumps do NOT match the "physis-core/**" pathspec (the
  # gitlink path is the directory itself, not a descendant), so the gate would
  # only ever run on release tag pushes. Dispatch makes it runnable on demand:
  #   gh workflow run "physis-core CI" --ref research/perspective-discovery-v2
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo check (no default features — dependency-light)
        run: cargo check -p physis-core --no-default-features
      - name: cargo check (default)
        run: cargo check -p physis-core
      - name: cargo check (all features)
        run: cargo check -p physis-core --all-features
      # Day 2 boundary gate (docs/plans/2026-09-15-core-pro-development.md):
      # the dependency direction, the exported modules and the CLI surface. The
      # isolated build below is the fourth part — Core must build with no Pro
      # checkout at all, which a workspace-scoped check cannot prove.
      - name: boundary — Core must not name Pro, and must expose no product verb
        run: scripts/check-core-boundary.sh
      - name: isolated build (Core with no Pro checkout)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          # tar, not cp -a: the submodule carries a 1.3 GB stale target/ that
          # has no business in the copy and would make this step unaffordable.
          tar -C physis-core --exclude=target -cf - . | tar -C "$tmp" -xf -
          cd "$tmp"
          cargo check --no-default-features
      - name: clippy
        run: cargo clippy -p physis-core --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (default)
        run: cargo test -p physis-core
      - name: cargo test (all features)
        run: cargo test -p physis-core --all-features
